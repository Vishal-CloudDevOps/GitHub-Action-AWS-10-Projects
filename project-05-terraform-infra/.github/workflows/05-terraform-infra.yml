# ============================================================
# Project 05 — Terraform Infrastructure Pipeline
# ============================================================
# CONCEPTS TAUGHT:
#   - Terraform fmt (format check)
#   - Terraform validate (syntax + semantic validation)
#   - Terraform plan (generates execution plan)
#   - Terraform apply with environment approval gate
#   - S3 backend + DynamoDB state locking
#   - Plan output as PR comment
#   - Manual approval before apply
# ============================================================

name: 05 — Terraform Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'project-05-terraform-infra/**'
      - '.github/workflows/05-terraform-infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'project-05-terraform-infra/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write
  pull-requests: write    # Required to post plan output as PR comment

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.7.4'
  TF_WORKING_DIR: project-05-terraform-infra/terraform

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel terraform operations — dangerous!

jobs:
  # ──────────────────────────────────────────
  # JOB: Terraform Format Check
  # ──────────────────────────────────────────
  tf-format:
    name: 📐 Terraform Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        # -check: don't reformat, just check (exit 1 if unformatted)
        # -recursive: check all .tf files in subdirectories
        # -diff: show what would change
        run: terraform fmt -check -recursive -diff
        continue-on-error: false

  # ──────────────────────────────────────────
  # JOB: Terraform Validate
  # ──────────────────────────────────────────
  tf-validate:
    name: ✅ Terraform Validate
    runs-on: ubuntu-latest
    needs: tf-format
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (local — no backend for validation)
        # -backend=false: skip backend init — we just need to validate syntax
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # ──────────────────────────────────────────
  # JOB: Security Scan (tfsec / Checkov)
  # ──────────────────────────────────────────
  tf-security:
    name: 🔒 Terraform Security Scan (tfsec)
    runs-on: ubuntu-latest
    needs: tf-validate
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: true   # Report but don't block on findings

  # ──────────────────────────────────────────
  # JOB: Terraform Plan
  # ──────────────────────────────────────────
  tf-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: [tf-validate, tf-security]
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false  # Disable wrapper for cleaner output parsing

      # OIDC authentication — needs sts:AssumeRoleWithWebIdentity
      # Plus permissions for S3 (state), DynamoDB (locking), and resource creation
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=project-05/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="environment=production" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Save the plan for the apply job
      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan-output.txt
          retention-days: 7

      # Post plan output as a PR comment so reviewers can see what will change
      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan-output.txt', 'utf8');
            const truncated = plan.length > 65000 ? plan.substring(0, 65000) + '\n...[truncated]' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Terraform Plan Output\n\n<details><summary>Show Plan</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n\n</details>`
            });

  # ──────────────────────────────────────────
  # JOB: Terraform Apply
  # Only runs on push to main AND requires manual approval
  # ──────────────────────────────────────────
  tf-apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: tf-plan
    # Only apply on push to main, not on PRs
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')

    # This environment has a required reviewer set in GitHub Settings
    # The job will pause here until a team member approves
    environment:
      name: production
      url: https://console.aws.amazon.com/ec2/

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=project-05/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        # Apply the EXACT plan that was reviewed — no surprises
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        run: |
          echo "## 🏗️ Infrastructure Deployed!" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY
