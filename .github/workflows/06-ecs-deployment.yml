# ============================================================
# Project 06 — ECS Fargate Deployment Pipeline
# ============================================================
# CONCEPTS TAUGHT:
#   - Building and pushing Docker images to ECR
#   - Rendering ECS task definitions with new image URIs
#   - Deploying to ECS Fargate with rolling updates
#   - Waiting for ECS service stability after deploy
#   - Health check verification post-deploy
#   - Job outputs passing image URI between jobs
# ============================================================

name: 06 — ECS Fargate Deployment

on:
  push:
    branches: [main]
    paths:
      - 'project-06-ecs-deployment/**'
      - '.github/workflows/06-ecs-deployment.yml'
  pull_request:
    branches: [main]
    paths:
      - 'project-06-ecs-deployment/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: project-06-app
  ECS_CLUSTER: project-06-cluster
  ECS_SERVICE: project-06-service
  CONTAINER_NAME: project-06-app

concurrency:
  group: ecs-deploy-${{ github.ref }}
  cancel-in-progress: false  # Never cancel an in-progress ECS deploy

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Test
  # ──────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-06-ecs-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project-06-ecs-deployment/package-lock.json
      - run: npm ci
      - run: npm test

  # ──────────────────────────────────────────
  # JOB 2: Build, Scan & Push Docker image to ECR
  # ──────────────────────────────────────────
  build-and-push:
    name: 🐳 Build, Scan & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    # Expose the image URI so the deploy job can use it
    outputs:
      image-uri: ${{ steps.image-uri.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECSRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image (load for scanning)
        uses: docker/build-push-action@v5
        with:
          context: project-06-ecs-deployment
          push: false
          load: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan BEFORE pushing — don't push vulnerable images
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Push ONLY after scan passes
      - name: Push to ECR
        if: github.event_name != 'pull_request'
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} $IMAGE_URI
          docker push $IMAGE_URI

          # Also tag as latest
          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # Set output for downstream job
      - name: Set image URI output
        id: image-uri
        if: github.event_name != 'pull_request'
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          echo "uri=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────
  # JOB 3: Deploy to ECS Fargate
  # ──────────────────────────────────────────
  deploy-ecs:
    name: 🚀 Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://your-alb-dns-name.us-east-1.elb.amazonaws.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECSRole
          aws-region: ${{ env.AWS_REGION }}

      # Render the task definition with the new image URI
      # This replaces IMAGE_URI_PLACEHOLDER in task-definition.json
      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: project-06-ecs-deployment/ecs/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image-uri }}
          environment-variables: |
            APP_VERSION=${{ github.sha }}
            NODE_ENV=production

      # Register the new task definition revision and update the service
      # Rolling update: ECS replaces tasks one at a time, maintaining availability
      - name: Deploy to ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Wait until the service reaches steady state before marking success
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          echo "## 🚀 ECS Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ env.ECS_CLUSTER }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ env.ECS_SERVICE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ needs.build-and-push.outputs.image-uri }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
