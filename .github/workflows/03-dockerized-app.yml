# ============================================================
# Project 03 — Dockerized App Pipeline
# ============================================================
# CONCEPTS TAUGHT:
#   - Docker build with BuildKit / build-push-action
#   - Layer caching (GitHub Actions Cache backend)
#   - Trivy container image scanning (CRITICAL/HIGH CVE detection)
#   - Amazon ECR authentication and image push
#   - OCI image tags (branch, sha, semver)
#   - OIDC authentication to AWS (preferred over access keys)
#   - Failing on security scan results
# ============================================================

# ============================================================
# Project 03 — Docker Build, Scan & Push to ECR
# Complete Workflow with Separated Stages
# ============================================================

name: 03 — Docker Build, Scan & Push to ECR

on:
  push:
    branches: [main, develop]
    paths:
      - 'project-03-dockerized-app/**'
      - '.github/workflows/03-dockerized-app.yml'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
    paths:
      - 'project-03-dockerized-app/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write
  pull-requests: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: project-03-dockerized-app
  REGISTRY_ALIAS: my-registry

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════
  # STAGE 1: SECRET SCAN (fail fast)
  # ══════════════════════════════════════════════════════════
  secret-scan:
    name: 🔐 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════
  # STAGE 2: UNIT TESTS (before expensive build)
  # ══════════════════════════════════════════════════════════
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: project-03-dockerized-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project-03-dockerized-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: project-03-dockerized-app/coverage/
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # STAGE 3: BUILD & SAVE ARTIFACT
  # ══════════════════════════════════════════════════════════
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-name: ${{ steps.image-name.outputs.name }}
      image-tag: ${{ steps.image-tag.outputs.tag }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: network=host

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set image name output
        id: image-name
        run: echo "name=${{ env.ECR_REPOSITORY }}" >> $GITHUB_OUTPUT

      - name: Set image tag output
        id: image-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: project-03-dockerized-app
          file: project-03-dockerized-app/Dockerfile
          target: production
          push: false
          load: true
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REPOSITORY }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Save Docker image to artifact
        run: |
          docker save ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -o /tmp/docker-image.tar
          
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp/docker-image.tar
          retention-days: 1

      - name: Build summary
        run: |
          echo "### 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** (see logs)" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════
  # STAGE 4: TRIVY SECURITY SCAN (separated job)
  # ══════════════════════════════════════════════════════════
  scan:
    name: 🔍 Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/docker-image.tar
          docker image ls

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-name }}:${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container-scan'

      - name: Comment on PR with scan results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const trivy = JSON.parse(fs.readFileSync('trivy-results.sarif', 'utf8'));
            
            let comment = '## 🔍 Trivy Security Scan Results\n\n';
            
            if (trivy.runs[0].results.length === 0) {
              comment += '✅ **No vulnerabilities found!**';
            } else {
              const criticals = trivy.runs[0].results.filter(r => r.level === 'error').length;
              const highs = trivy.runs[0].results.filter(r => r.level === 'warning').length;
              comment += `⚠️ **Found ${trivy.runs[0].results.length} vulnerabilities**\n`;
              comment += `- CRITICAL: ${criticals}\n`;
              comment += `- HIGH: ${highs}\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Scan summary
        if: always()
        run: |
          echo "### 🔍 Trivy Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.sarif ]; then
            VULN_COUNT=$(jq '.runs[0].results | length' trivy-results.sarif)
            echo "- **Vulnerabilities:** $VULN_COUNT" >> $GITHUB_STEP_SUMMARY
          fi

  # ══════════════════════════════════════════════════════════
  # STAGE 5: PUSH TO ECR (only after scan passes)
  # ══════════════════════════════════════════════════════════
  push-to-ecr:
    name: 📤 Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: |
      github.event_name != 'pull_request' && 
      success() &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/'))
    outputs:
      image-uri: ${{ steps.output.outputs.image-uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/OIDC_Role_GitHubActions
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GithubActions-Project03-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        id: docker-build-push
        uses: docker/build-push-action@v5
        with:
          context: project-03-dockerized-app
          file: project-03-dockerized-app/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Set output
        id: output
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          echo "image-uri=${REGISTRY}/${{ env.ECR_REPOSITORY }}@${{ steps.docker-build-push.outputs.digest }}" >> $GITHUB_OUTPUT

      - name: Push summary
        run: |
          echo "### 📤 Image Pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.docker-build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════
  # FINAL: REPORT STATUS
  # ══════════════════════════════════════════════════════════
  report:
    name: 📋 Pipeline Report
    runs-on: ubuntu-latest
    needs: [secret-scan, test, build, scan, push-to-ecr]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "### Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | ${{ needs.scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Push | ${{ needs.push-to-ecr.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any stage failed
        if: |
          needs.secret-scan.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.build.result == 'failure' ||
          needs.scan.result == 'failure'
        run: exit 1
