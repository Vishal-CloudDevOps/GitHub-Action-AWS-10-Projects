version: '3.9'

# Local development docker-compose
# Usage: docker-compose up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Build the production stage (not tester)
      target: production
    image: project-03-app:local
    container_name: project03-app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - APP_VERSION=local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
