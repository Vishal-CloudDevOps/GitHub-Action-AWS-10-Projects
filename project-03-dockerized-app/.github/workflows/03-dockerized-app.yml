# ============================================================
# Project 03 — Dockerized App Pipeline
# ============================================================
# CONCEPTS TAUGHT:
#   - Docker build with BuildKit / build-push-action
#   - Layer caching (GitHub Actions Cache backend)
#   - Trivy container image scanning (CRITICAL/HIGH CVE detection)
#   - Amazon ECR authentication and image push
#   - OCI image tags (branch, sha, semver)
#   - OIDC authentication to AWS (preferred over access keys)
#   - Failing on security scan results
# ============================================================

name: 03 — Docker Build, Scan & Push to ECR

on:
  push:
    branches: [main, develop]
    paths:
      - 'project-03-dockerized-app/**'
      - '.github/workflows/03-dockerized-app.yml'
    tags:
      - 'v*.*.*'    # Trigger on semantic version tags too
  pull_request:
    branches: [main]
    paths:
      - 'project-03-dockerized-app/**'
  workflow_dispatch:

# Minimum required permissions
permissions:
  contents: read
  id-token: write      # Required for OIDC AWS authentication
  security-events: write  # Required to upload SARIF scan results

env:
  # Your AWS account details — set these as repo variables or hardcode non-secrets
  AWS_REGION: us-east-1
  ECR_REPOSITORY: project-03-dockerized-app

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # JOB: Secret Scan
  # ──────────────────────────────────────────
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────
  # JOB: Unit Tests (before building image)
  # Run tests BEFORE building Docker image to fail fast and save build time
  # ──────────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: project-03-dockerized-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project-03-dockerized-app/package-lock.json
      - run: npm ci
      - run: npm test

  # ──────────────────────────────────────────
  # JOB: Docker Build & Scan (no push on PR)
  # ──────────────────────────────────────────
  docker-build-scan:
    name: 🐳 Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx — enables advanced build features like:
      # - Multi-platform builds (amd64 + arm64)
      # - Inline cache
      # - BuildKit features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Extract metadata for Docker image tags and labels
      # This automatically generates appropriate tags based on context:
      # - Push to main → "latest" + "sha-abc123"
      # - Tag v1.2.3 → "1.2.3" + "1.2" + "1"
      # - PR → "pr-42"
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Method 1: OIDC Authentication (RECOMMENDED) ──────────────
      # No long-lived credentials stored in GitHub Secrets
      # GitHub gets a short-lived OIDC token and exchanges it for AWS credentials
      # This is the MODERN and SECURE way to authenticate
      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # This is the IAM role GitHub assumes via OIDC
          # You create this role in AWS IAM with a trust policy for GitHub
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}
          # Token lasts 1 hour — enough for most builds
          role-session-name: GitHubActions-Project03-${{ github.run_id }}

      # ── Method 2: Access Key Authentication (ALTERNATIVE) ────────
      # Uncomment this block and comment out the OIDC block above to use keys instead
      # Less secure — long-lived credentials stored in GitHub Secrets
      #
      # - name: Configure AWS credentials (Access Keys)
      #   if: github.event_name != 'pull_request'
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build the Docker image using build-push-action
      # On PRs: build only (no push) — validates the Dockerfile
      # On merge to main: build AND push to ECR
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: project-03-dockerized-app
          file: project-03-dockerized-app/Dockerfile
          target: production        # Use the production stage
          # push=false on PRs (build only), push=true on main
          push: false
          # Load image into local Docker daemon for scanning
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions Cache backend — dramatically speeds up repeat builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run Trivy vulnerability scanner on the built image
      # This scans for known CVEs in OS packages and language dependencies
      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          # Scan the locally loaded image
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          # CRITICAL and HIGH vulnerabilities will FAIL the build
          severity: 'CRITICAL,HIGH'
          exit-code: '1'           # Exit 1 = fail the job

      # Upload Trivy scan results to GitHub Security tab
      - name: Upload Trivy scan to GitHub Security
        if: always()   # Upload even if scan failed
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # Now push to ECR (only on non-PR runs after scanning passes)
      - name: Push to Amazon ECR
        if: github.event_name != 'pull_request' && success()
        uses: docker/build-push-action@v5
        with:
          context: project-03-dockerized-app
          file: project-03-dockerized-app/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URI
        if: github.event_name != 'pull_request'
        run: |
          echo "### 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
