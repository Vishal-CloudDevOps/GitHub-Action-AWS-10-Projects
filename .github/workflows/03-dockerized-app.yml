# ============================================================
# Project 03 — Dockerized App Pipeline
# ============================================================
# CONCEPTS TAUGHT:
#   - Docker build with BuildKit / build-push-action
#   - Layer caching (GitHub Actions Cache backend)
#   - Trivy container image scanning (CRITICAL/HIGH CVE detection)
#   - Amazon ECR authentication and image push
#   - OCI image tags (branch, sha, semver)
#   - OIDC authentication to AWS (preferred over access keys)
#   - Failing on security scan results
# ============================================================

name: 03 — Docker Build, Scan & Push to ECR

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: project-03-dockerized-app

jobs:
  # ────── BUILD STAGE ──────
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
      
      # Build and save to tarball
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: project-03-dockerized-app
          file: project-03-dockerized-app/Dockerfile
          push: false
          outputs: type=oci,dest=/tmp/image
      
      # Upload image artifact
      - name: Upload image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: /tmp/image
          retention-days: 1

  # ────── SCAN STAGE ──────
  scan:
    name: 🔍 Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: docker-image
          path: /tmp/image
      
      - name: Load image
        run: |
          docker load --input /tmp/image/index.json
      
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
      
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ────── PUSH STAGE ──────
  push:
    name: 📤 Push to ECR
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.event_name != 'pull_request' && success()
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/setup-buildx-action@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/OIDC_Role_GitHubActions
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Push to ECR
        uses: docker/build-push-action@v5
        with:
          context: project-03-dockerized-app
          push: true
          tags: ${{ needs.build.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max