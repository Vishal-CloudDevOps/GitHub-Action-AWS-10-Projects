# ============================================================
# Reusable Workflow — Terraform Plan & Apply
# ============================================================
# Call this from any project workflow with:
#
#   jobs:
#     terraform:
#       uses: ./.github/workflows/reusable-terraform.yml
#       with:
#         working-directory: project-05-terraform-infra/terraform
#         environment: production
#         tf-action: apply
#       secrets:
#         AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
#         TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
#         TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
# ============================================================

name: Reusable — Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      environment:
        required: true
        type: string
      tf-action:
        required: false
        type: string
        default: 'plan'
        description: 'plan or apply'
      aws-region:
        required: false
        type: string
        default: 'us-east-1'
      tf-version:
        required: false
        type: string
        default: '1.7.4'
    secrets:
      AWS_ACCOUNT_ID:
        required: true
      TF_STATE_BUCKET:
        required: true
      TF_LOCK_TABLE:
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    name: Terraform ${{ inputs.tf-action }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.tf-action == 'apply' && inputs.environment || '' }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.tf-version }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsTerraformRole
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.tf-action == 'plan' || inputs.tf-action == 'apply'
        id: plan
        run: |
          terraform plan \
            -var="environment=${{ inputs.environment }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan-output.txt

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ inputs.working-directory }}/plan-output.txt', 'utf8');
            const truncated = plan.length > 65000
              ? plan.substring(0, 65000) + '\n...[truncated]'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📋 Terraform Plan — \`${{ inputs.environment }}\`\n\n<details><summary>Show Plan</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n</details>`
            });

      - name: Terraform Apply
        if: inputs.tf-action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        if: inputs.tf-action == 'apply'
        run: terraform output -no-color >> $GITHUB_STEP_SUMMARY
