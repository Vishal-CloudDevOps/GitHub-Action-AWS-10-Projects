# ============================================================
# Composite Action — Docker Build & Push to ECR
# ============================================================
# Bundles the full build → scan → push pattern into one action.
#
# Usage:
#   - uses: ./.github/composite-actions/docker-build-push
#     with:
#       context: project-03-dockerized-app
#       ecr-repository: my-app
#       image-tag: ${{ github.sha }}
#       push: 'true'
# ============================================================

name: Docker Build & Push to ECR
description: 'Build Docker image, run Trivy scan, and optionally push to ECR'

inputs:
  context:
    description: 'Docker build context directory'
    required: true
  ecr-repository:
    description: 'ECR repository name'
    required: true
  image-tag:
    description: 'Tag to apply to the image'
    required: true
  push:
    description: 'Push image to ECR (true/false)'
    required: false
    default: 'false'
  trivy-exit-code:
    description: 'Exit code for Trivy on findings (0=warn, 1=fail)'
    required: false
    default: '1'

outputs:
  image-uri:
    description: 'Full ECR URI of the pushed image'
    value: ${{ steps.push.outputs.image-uri }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        push: false
        load: true
        tags: ${{ inputs.ecr-repository }}:${{ inputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ inputs.ecr-repository }}:${{ inputs.image-tag }}
        format: table
        severity: CRITICAL,HIGH
        exit-code: ${{ inputs.trivy-exit-code }}

    - name: Login to Amazon ECR
      if: inputs.push == 'true'
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Push to ECR
      if: inputs.push == 'true'
      id: push
      shell: bash
      run: |
        ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
        FULL_URI="$ECR_REGISTRY/${{ inputs.ecr-repository }}:${{ inputs.image-tag }}"
        docker tag ${{ inputs.ecr-repository }}:${{ inputs.image-tag }} "$FULL_URI"
        docker push "$FULL_URI"
        echo "image-uri=$FULL_URI" >> $GITHUB_OUTPUT
        echo "✅ Pushed: $FULL_URI"
