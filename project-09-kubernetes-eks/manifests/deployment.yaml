# ============================================================
# Kubernetes Deployment — Project 09
# ============================================================
# This manifest defines how the application runs in Kubernetes.
# The image tag is replaced by the CI pipeline using envsubst
# or helm --set image.tag=...

apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-09-app
  namespace: project-09
  labels:
    app: project-09-app
    version: "1.0.0"
    managed-by: github-actions
spec:
  # Run 2 replicas for high availability
  replicas: 2

  selector:
    matchLabels:
      app: project-09-app

  # Rolling update strategy: replace pods one at a time
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Allow 1 extra pod during update
      maxUnavailable: 0    # Never have fewer than desired replicas

  template:
    metadata:
      labels:
        app: project-09-app
    spec:
      # Security context for the entire pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Graceful termination — wait 30s before force-killing
      terminationGracePeriodSeconds: 30

      containers:
        - name: app
          image: IMAGE_URI_PLACEHOLDER    # Replaced by CI pipeline
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            # Inject pod info via Downward API
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: APP_VERSION
              value: "APP_VERSION_PLACEHOLDER"   # Replaced by CI

          # Resource requests and limits — CRITICAL for cluster stability
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          # Liveness probe: restart pod if it becomes unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          # Readiness probe: don't route traffic until app is ready
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # Security context for the container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # Writable tmp dir (needed even with readOnlyRootFilesystem)
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
